server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true
alert-api:
  security:
    user: "admin1"
    password: "password"
  ## Paths to save/read backup list
  out-path: ./app/resources/alerts.list
  in-path: ./app/resources/alerts.list
  ## Time-Zone
  zone: "Europe/Warsaw"
  ## Enable filter out old alerts
  actual-filter: false
##open-api map paths
springdoc:
  swagger-ui:
    path: "/ui"
